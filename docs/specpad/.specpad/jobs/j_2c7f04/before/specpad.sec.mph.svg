<rect width="800" height="880" fill="#FEFEFE"/>
<text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#0F172A">Security view 4 — Multi-patient harm: the indirect path, and what interrupts it</text>
